format = 2

[effect]
id = "wenzoo.color-wheels-cn"
name = "色轮调色"
kind = "effect"
category = "色彩"
order = 14
description = "分别调整阴影、中间调和高光的色相与明暗，实现分区色彩校正。"

[[param]]
key = "lift"
group = "色轮"
label = "阴影"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gamma"
group = "色轮"
label = "中间调"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gain"
group = "色轮"
label = "高光"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a teal shadow and a warm
# highlight.
[card]
params = { "lift.x" = 0.0, "lift.y" = -0.6, "gain.x" = 0.35, "gain.y" = 0.45 }
