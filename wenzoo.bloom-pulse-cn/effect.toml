format = 2

[effect]
id = "wenzoo.bloom-pulse-cn"
name = "光晕脉冲"
kind = "effect"
category = "光效"
shelves = ["精选"]
order = 72
version = 2
intensity = "amount"
description = "在高光区域叠加柔和光晕，并使其随时间明暗呼吸。"

[[param]]
key = "amount"
label = "强度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "速度"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"

# The bloom is the highlights' light spread by a Gaussian, drawn across and
# then down at a quarter of the layer's pixels, three of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]
