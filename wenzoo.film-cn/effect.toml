format = 2

[effect]
id = "wenzoo.film-cn"
name = "胶片质感"
kind = "filter"
category = "电影感"
order = 34
intensity = "grain"
description = "采用具有真实 Toe 和 Shoulder 曲线的胶片影调，在灯光周围加入温暖的晕光，并叠加动态颗粒，还原电影胶片而非普通滤镜的质感。"

[[param]]
key = "grain"
label = "颗粒强度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "暖色程度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
