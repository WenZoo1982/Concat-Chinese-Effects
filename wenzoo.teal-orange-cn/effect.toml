format = 2

[effect]
id = "wenzoo.teal-orange-cn"
name = "青橙电影调色"
kind = "filter"
category = "电影感"
order = 30
intensity = "amount"
description = "在阴影中加入青绿色，在高光中加入橙色，同时保持肤色自然，并叠加胶片曲线，呈现经典商业电影色调。"

[[param]]
key = "amount"
label = "效果强度"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "skin"
label = "肤色保护"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
