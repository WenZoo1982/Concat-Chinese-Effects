[effect]
id = "wenzoo.pitch-cn"
name = "音高调整"
kind = "audio"
category = "人声"
order = 10
intensity = "semitones"
description = "按半音升高或降低音高，同时保持音频时长不变。"

[[param]]
key = "semitones"
label = "半音"
min = -12
max = 12
default = 0
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, semitones / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)}"
