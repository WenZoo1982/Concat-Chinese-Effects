format = 2

[effect]
id = "wenzoo.glow-cn"
name = "柔光"
kind = "effect"
category = "风格化"
shelves = ["精选", "光影"]
order = 42
version = 2
intensity = "amount"
description = "画面明亮区域周围呈现出柔和的光晕。"

[[param]]
key = "amount"
label = "强度"
min = 10
max = 100
default = 45
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# The glow is a wide Gaussian, drawn across and then down at a quarter of
# the layer's pixels, four of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]
