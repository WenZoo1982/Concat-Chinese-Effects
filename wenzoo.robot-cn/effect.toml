[effect]
id = "wenzoo.robot-cn"
name = "机器人音效"
kind = "audio"
category = "人声"
order = 13
intensity = "depth"
description = "将人声处理为带有金属质感和调制效果的机器人声音。"

[[param]]
key = "depth"
label = "效果深度"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aphaser=type=t:speed={fixed(0.4 + (depth / 10) * 1.6, 2)}:decay=0.6,flanger=delay=2:depth=4:speed=0.8,equalizer=f=1800:t=q:w=1.2:g=3,alimiter=limit=0.94"
