format = 2

[effect]
id = "wenzoo.vibrance-cn"
name = "自然饱和度"
kind = "filter"
category = "色彩"
order = 32
# 2: the parameter is `amount`; a project that stored `intensity` for it
# takes the default.
version = 2
intensity = "amount"
description = "优先增强原本较为暗淡的色彩，同时避免已经鲜艳的颜色过度饱和。"

[[param]]
key = "amount"
label = "增强幅度"
min = 0.1
max = 2
default = 0.7
step = 0.05

[wgsl]
entry = "effect.wgsl"
space = "display"
