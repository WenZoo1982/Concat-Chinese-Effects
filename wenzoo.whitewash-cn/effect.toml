format = 2

[effect]
id = "wenzoo.whitewash-cn"
name = "清透泛白"
kind = "filter"
category = "日常"
order = 17
intensity = "matte"
description = "明亮的哑光效果：柔化并冷却白色，明显抬高黑位，降低色彩浓度，呈现干净简约的白色空间质感。"

[[param]]
key = "matte"
label = "哑光强度"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "cool"
label = "冷色程度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
