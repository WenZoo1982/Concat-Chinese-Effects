[effect]
id = "wenzoo.treble-cn"
name = "高音增强"
kind = "audio"
category = "音色"
order = 21
intensity = "gain"
description = "提升高频，让声音更加清亮通透。"

[[param]]
key = "gain"
label = "增益"
min = 0
max = 12
default = 4
step = 0.5
unit = "dB"

[ffmpeg]
chain = "treble=g={fixed(gain, 2)}:f=9000:w=0.7,alimiter=limit=0.95"
