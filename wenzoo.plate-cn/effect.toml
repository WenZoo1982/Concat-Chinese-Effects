[effect]
id = "wenzoo.plate-cn"
name = "板式混响"
kind = "audio"
category = "空间"
order = 33
intensity = "size"
description = "模拟录音棚板式混响：声音密集、明亮，衰减时间较短。"

[[param]]
key = "size"
label = "空间大小"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(8 * scale)}|{round(17 * scale)}|{round(29 * scale)}|{round(43 * scale)}:0.45|0.35|0.25|0.15"
