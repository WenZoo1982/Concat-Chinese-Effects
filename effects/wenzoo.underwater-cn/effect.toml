[effect]
id = "wenzoo.underwater-cn"
name = "水下音效"
kind = "audio"
category = "空间"
order = 34
intensity = "depth"
description = "模拟声音沉入水面之下的效果，通过强烈的低通滤波削弱高频。"

[[param]]
key = "depth"
label = "水下深度"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowpass=f={fixed(800 - depth * 40, 1)},equalizer=f=200:t=q:w=2.0:g={fixed(2 + depth * 0.3, 2)},alimiter=limit=0.92"
