[effect]
id = "wenzoo.hall-cn"
name = "音乐厅混响"
kind = "audio"
category = "空间"
order = 32
intensity = "size"
description = "模拟音乐厅空间，营造悠长而均匀的反射混响。"

[[param]]
key = "size"
label = "空间大小"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.85:{round(60 * scale)}|{round(110 * scale)}|{round(180 * scale)}|{round(270 * scale)}:0.5|0.4|0.3|0.2"
