format = 2

[effect]
id = "wenzoo.zoom-blur-cn"
name = "变焦模糊"
kind = "effect"
category = "模糊"
order = 23
intensity = "amount"
description = "从指定中心点向外产生放射状拖影，模拟镜头在拍摄过程中快速变焦的效果。"

[[param]]
key = "amount"
label = "模糊强度"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[[param]]
key = "x"
label = "中心位置 X"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "y"
label = "中心位置 Y"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# Sixteen scales a pass, each pass filling in between two of the next
# one's: four thousand and ninety-six along each streak.
[[wgsl.pass]]
target = "fine"

[[wgsl.pass]]
target = "middle"
