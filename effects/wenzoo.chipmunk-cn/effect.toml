[effect]
id = "wenzoo.chipmunk-cn"
name = "花栗鼠变声"
kind = "audio"
category = "人声"
order = 12
intensity = "pitch"
description = "将声音调高，呈现更尖细、活泼的花栗鼠音效。"

[[param]]
key = "pitch"
label = "音高"
min = 3
max = 12
default = 7
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},highpass=f=120,alimiter=limit=0.94"
