[effect]
id = "wenzoo.denoise-cn"
name = "音频降噪"
kind = "audio"
category = "清理"
order = 41
intensity = "strength"
description = "去除人声底噪中的嗡鸣声和嘶嘶声。"

[[param]]
key = "strength"
label = "降噪强度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "afftdn=nf={fixed(0 - 20 - strength / 100 * 30, 1)}:nr={fixed(6 + strength / 100 * 30, 1)}"
