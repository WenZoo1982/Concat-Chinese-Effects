format = 2

[effect]
id = "wenzoo.cool-blue-cn"
name = "冷蓝电影感"
kind = "filter"
category = "电影感"
order = 32
intensity = "chill"
description = "为阴影和中间调加入蓝色，保持高光与肤色自然，并增强对比度，适合黄昏时分的城市画面。"

[[param]]
key = "chill"
label = "冷蓝强度"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
