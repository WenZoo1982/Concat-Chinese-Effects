[effect]
id = "wenzoo.echo-cn"
name = "回声"
kind = "audio"
category = "空间"
order = 30
intensity = "decay"
description = "为声音添加一次逐渐衰减的重复回响。"

[[param]]
key = "delay"
label = "延迟时间"
min = 0.05
max = 1
default = 0.25
step = 0.05
unit = "s"

[[param]]
key = "decay"
label = "衰减程度"
min = 0.1
max = 0.9
default = 0.4
step = 0.05

[ffmpeg]
chain = "aecho=0.8:0.85:{round(delay * 1000)}:{fixed(decay, 2)}"
