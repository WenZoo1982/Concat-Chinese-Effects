format = 2

[effect]
id = "wenzoo.push-cn"
name = "推入转场"
kind = "transition"
category = "滑动"
order = 5
description = "下一个镜头将上一个镜头推出画面，两个镜头同步移动，并在速度最快时加入运动模糊拖影。"

[[param]]
key = "direction"
label = "方向"
type = "enum"
values = [0, 1, 2, 3]
labels = ["向左", "向右", "向上", "向下"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
